# ケーススタディ（本番のケーススタディ形式の練習用）
# 問題側で `case: <id>` を指定すると、問題文の前にシナリオが表示される。

- id: contoso-support-rag
  title: "Contoso サポート アシスタント"
  scenario: |
    **概要**
    Contoso は家電メーカーです。製品マニュアルと過去の問い合わせをもとに回答する、社内向けサポート アシスタント（RAG アプリ）を Azure で構築します。

    **現在の構成**
    - フロントエンドと API は Python（FastAPI）のコンテナーで、Azure Container Registry `contosoacr` にイメージを保存している。
    - 文書（マニュアルのチャンクと埋め込み）は Azure Cosmos DB for NoSQL に保存する。パーティション キーは `/productLine`。
    - 埋め込みは 1536 次元で、文書は約 800 万チャンクある。
    - 管理者が文書を更新すると、その文書の埋め込みを再計算する必要がある。
    - 回答の生成（LLM 呼び出し）は時間がかかるため、非同期のワーカーで処理する。

    **要件**
    1. API は Azure Container Apps でホストし、リクエスト数に応じてスケールする。ワーカーは処理待ちのジョブ数に応じてスケールし、ジョブがないときは 0 にする。
    2. ジョブは確実に 1 回は処理し、何度も失敗するジョブは隔離して調査できるようにする。
    3. 同じ意味の質問が繰り返されるため、LLM の呼び出し回数を減らしたい。
    4. 接続文字列やキーをコードや環境変数に平文で置かない。
    5. API → キュー → ワーカー → LLM までの処理を 1 つのトレースとして追跡し、遅い箇所を特定できるようにする。

- id: fabrikam-agent-backend
  title: "Fabrikam エージェントのツール バックエンド"
  scenario: |
    **概要**
    Fabrikam は保険会社です。AI エージェントが「契約の検索」「類似事例の検索」を行うためのツール API を構築します。

    **現在の構成**
    - 契約データは Azure Database for PostgreSQL フレキシブル サーバー（General Purpose、PostgreSQL 16）にあり、顧客・契約・請求のテーブルが正規化されている。
    - 類似事例の検索用に、請求の説明文の埋め込み（1536 次元）を同じデータベースに保存したい。
    - ツール API は Azure Functions（Flex Consumption、Python）で実装し、同時実行数が急増することがある。
    - データは代理店（agency）ごとに分けて検索する必要がある。代理店は 2,000 社あり、データ量は代理店ごとに大きく偏っている。

    **要件**
    1. 契約テーブルとの結合や代理店による絞り込みと、ベクトル検索を 1 つの SQL で行う。
    2. 代理店で絞り込んでも、指定した件数（上位 10 件）を確実に返す。
    3. 関数のスケール アウト時に、データベースの接続数が上限に達しないようにする。
    4. パスワードを使わずに接続する。
